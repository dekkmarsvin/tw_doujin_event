name: Verify and deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test public artifact
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit --incremental false

      - name: Build pinned production event
        run: npm run build:production

      - name: Normalize Cloudflare API token
        id: cloudflare-auth
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="$RAW_CLOUDFLARE_API_TOKEN"
          if [[ "$token" == *"Authorization: Bearer "* ]]; then
            token="$(printf '%s' "$token" | sed -n 's/.*Authorization: Bearer \([^"[:space:]]*\).*/\1/p' | head -n 1)"
          fi
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          if [[ ${#token} -lt 20 || ! "$token" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Cloudflare API token has an unsupported format." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Ensure Pages Functions fail open at quota exhaustion
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-auth.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: tw-catalog
        run: node scripts/ensure-pages-fail-open.mjs

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.cloudflare-auth.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.120.1
          command: >-
            pages deploy dist
            --project-name=tw-catalog
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}

      # Gate the deployment on the Pages production origin. The custom domain
      # has a separate advisory check below because zone security rules can
      # reject a GitHub-hosted runner even while the public application is live.
      - name: Smoke test production deployment
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          BASE_URL: https://tw-catalog.pages.dev
        run: |
          for attempt in $(seq 1 8); do
            static_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE_URL/" || echo 000)
            session_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$BASE_URL/api/auth/session" || echo 000)
            if [ "$static_code" = "200" ] && [ "$session_code" = "401" ]; then
              if node scripts/smoke-published-events.mjs "$BASE_URL"; then
                echo "Production deployment is live; static assets, Functions and every published event asset passed smoke checks."
                exit 0
              fi
            fi
            echo "attempt $attempt: / returned $static_code; /api/auth/session returned $session_code"
            sleep 3
          done
          if [ "$static_code" = "301" ] || [ "$static_code" = "302" ]; then
            echo "::error::Pages production origin redirected instead of returning 200; verify tw-catalog.pages.dev is not covered by Access."
          else
            echo "::error::Production deployment returned /=$static_code and /api/auth/session=$session_code; expected 200 and 401."
          fi
          exit 1

      # Every non-main deployment is a preview. First prove that an anonymous
      # request is intercepted by Access, then use the service token to reach
      # both static assets and Functions. This catches an exposed immutable or
      # branch URL as well as a broken Service Auth policy.
      - name: Smoke test preview Access and application
        if: github.event_name == 'pull_request' || github.ref_name != 'main'
        env:
          BASE_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          IMMUTABLE_URL: ${{ steps.deploy.outputs.deployment-url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET must be set for preview Access. See docs/runbooks/deployment.md."
            exit 1
          fi

          for preview_url in "$BASE_URL" "$IMMUTABLE_URL"; do
            if [ -z "$preview_url" ]; then
              echo "::error::Wrangler did not report both preview alias and immutable deployment URLs."
              exit 1
            fi
            anonymous=$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' "$preview_url/" || echo '000 ')
            anonymous_code=${anonymous%% *}
            anonymous_redirect=${anonymous#* }
            if { [ "$anonymous_code" != "301" ] && [ "$anonymous_code" != "302" ]; } || [[ "$anonymous_redirect" != https://*.cloudflareaccess.com/* ]]; then
              echo "::error::Anonymous preview $preview_url returned $anonymous_code and did not redirect to Cloudflare Access."
              exit 1
            fi
            echo "Anonymous preview $preview_url is protected by Access."
          done

          for attempt in $(seq 1 8); do
            static_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$BASE_URL/" || echo 000)
            session_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$BASE_URL/api/auth/session" || echo 000)
            if [ "$static_code" = "200" ] && [ "$session_code" = "401" ]; then
              echo "Service token passed Access; static assets returned 200 and Functions returned the expected anonymous 401."
              exit 0
            fi
            echo "attempt $attempt: / returned $static_code; /api/auth/session returned $session_code"
            sleep 3
          done

          if [ "$static_code" = "301" ] || [ "$static_code" = "302" ]; then
            redirect=$(curl --silent --output /dev/null --write-out '%{redirect_url}' \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$BASE_URL/")
            token_status=$(node -e '
              const found = /[?&]meta=([^&]+)/.exec(process.argv[1]);
              if (!found) { console.log("unknown"); process.exit(0); }
              const claims = JSON.parse(Buffer.from(found[1].split(".")[1], "base64url").toString());
              console.log(String(claims.service_token_status));
            ' "$redirect" 2>/dev/null || echo unknown)
            echo "::error::Service token was redirected by Access; service_token_status=$token_status. See docs/runbooks/deployment.md."
          else
            echo "::error::Preview returned /=$static_code and /api/auth/session=$session_code; expected 200 and 401 after Access."
          fi
          exit 1


  # map.kotoban.top is the reader-facing production hostname. Keep observing it
  # anonymously, but do not turn a zone-level block of GitHub runner traffic into
  # a failed deployment after the Pages origin has already passed its smoke test.
  production-availability:
    name: Observe public production custom domain
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check anonymous production reachability
        shell: bash
        env:
          BASE_URL: https://map.kotoban.top
        run: |
          request() {
            local label="$1"
            local url="$2"
            local headers="$RUNNER_TEMP/$label.headers"
            local body="$RUNNER_TEMP/$label.body"
            local code

            if code=$(curl --silent --show-error --connect-timeout 3 --max-time 5 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$url"); then
              printf '%s' "$code"
            else
              printf '000'
            fi
          }

          diagnose() {
            local label="$1"
            local headers="$RUNNER_TEMP/$label.headers"
            local body="$RUNNER_TEMP/$label.body"
            local body_preview

            echo "$label response diagnostics:"
            if [ -s "$headers" ]; then
              grep --ignore-case --extended-regexp \
                '^(date|server|cf-ray|cf-mitigated|cf-cache-status|location|content-type):' \
                "$headers" || true
            else
              echo "no response headers captured"
            fi
            if [ -s "$body" ]; then
              body_preview=$(head --bytes 512 "$body" | tr '\r\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g')
              printf 'body preview: %s\n' "$body_preview"
            else
              echo "no response body captured"
            fi
          }

          for attempt in $(seq 1 8); do
            static_code=$(request static "$BASE_URL/")
            session_code=$(request session "$BASE_URL/api/auth/session")
            if [ "$static_code" = "200" ] && [ "$session_code" = "401" ]; then
              echo "Public production custom domain is live; static assets returned 200 and Functions returned the expected anonymous 401."
              exit 0
            fi
            echo "attempt $attempt: / returned $static_code; /api/auth/session returned $session_code"
            sleep 3
          done

          echo "UTC diagnostic time: $(date --utc --iso-8601=seconds)"
          diagnose static
          diagnose session
          echo "::warning::Public production custom domain returned /=$static_code and /api/auth/session=$session_code; expected 200 and 401. The Pages deployment passed separately, so inspect Cloudflare Security Events using the captured cf-ray values."


  # Every PR uses the same disposable preview D1. A separate globally serialized
  # job prevents one PR's cleanup from deleting another PR's in-flight fixture.
  preview-e2e:
    name: Full preview portal E2E
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-portal-e2e
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Full request-to-public-overlay flow
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BASE_URL: https://pr-${{ github.event.number }}.tw-catalog.pages.dev
          PREVIEW_E2E_TOKEN: ${{ secrets.PREVIEW_E2E_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$PREVIEW_E2E_TOKEN" ]; then
            echo "::error::PREVIEW_E2E_TOKEN must be set in GitHub Actions and as a Pages preview secret."
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET must be set; the preview host is behind Cloudflare Access."
            exit 1
          fi
          token="$CLOUDFLARE_API_TOKEN"
          if [[ "$token" == *"Authorization: Bearer "* ]]; then
            token="$(printf '%s' "$token" | sed -n 's/.*Authorization: Bearer \([^"[:space:]]*\).*/\1/p' | head -n 1)"
          fi
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          if [[ ${#token} -lt 20 || ! "$token" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Cloudflare API token has an unsupported format." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"
          # Capture rather than pipe. Piping wrangler straight into jq replaces
          # whatever wrangler said — success payload or error payload — with a jq
          # parse error, so a failed remote call is reported as an unrelated jq
          # message and the reason never reaches the log.
          fingerprint() {
            # `|| status=$?` and not a bare assignment: under `set -e` a failing
            # command substitution aborts the step immediately, which would skip
            # the reporting below and reproduce the very blindness being fixed.
            local raw status=0
            raw="$(npx wrangler d1 execute tw-catalog-identity --remote --json --command \
              "SELECT (SELECT COUNT(*) FROM accounts) AS accounts, (SELECT COUNT(*) FROM circle_claims) AS claims, (SELECT COUNT(*) FROM circle_overrides) AS overrides, COALESCE((SELECT SUM(revision) FROM overrides_doc), 0) AS revisions")" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::Could not read the production D1 fingerprint; wrangler exited $status. Anything it wrote to stderr is above." >&2
              [ -n "$raw" ] && { echo "wrangler stdout was:" >&2; printf '%s\n' "$raw" >&2; }
              return "$status"
            fi
            # A successful single statement comes back as a one-element array.
            # Anything else — notably an error payload, which is a bare object —
            # must be printed rather than blindly indexed.
            printf '%s' "$raw" | jq -ce 'if type == "array" then .[0].results[0] else error("not a d1 result array") end' || {
              echo "::error::wrangler --json returned a shape this check does not understand; it was expected to be a one-element array of statement results. Its stdout follows." >&2
              printf '%s\n' "$raw" >&2
              return 1
            }
          }
          production_before="$(fingerprint)"
          set +e
          node scripts/preview-portal-e2e.mjs
          e2e_status=$?
          set -e
          production_after="$(fingerprint)"
          if [ "$production_before" != "$production_after" ]; then
            echo "::error::Preview E2E changed production D1 counts or revisions."
            exit 1
          fi
          if [ "$e2e_status" -ne 0 ]; then
            echo "::error::Preview portal E2E failed; production fingerprint remained unchanged."
            exit "$e2e_status"
          fi
          echo "Preview E2E used isolated D1; production fingerprint is unchanged."
