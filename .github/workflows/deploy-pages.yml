name: Verify and deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test public artifact
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit --incremental false

      - name: Normalize Cloudflare API token
        id: cloudflare-auth
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="$RAW_CLOUDFLARE_API_TOKEN"
          if [[ "$token" == *"Authorization: Bearer "* ]]; then
            token="$(printf '%s' "$token" | sed -n 's/.*Authorization: Bearer \([^"[:space:]]*\).*/\1/p' | head -n 1)"
          fi
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          if [[ ${#token} -lt 20 || ! "$token" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Cloudflare API token has an unsupported format." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.cloudflare-auth.outputs.token }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.120.1
          command: >-
            pages deploy dist
            --project-name=tw-catalog
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}

      # Both checks send a Cloudflare Access service token. Without it an Access
      # policy answers every request with a 302 to its login page, and the
      # origin is never reached — which `curl --fail` treats as success, because
      # a redirect is not an error status. That is why the root check asserts
      # 200 rather than relying on --fail.
      - name: Smoke test deployment
        env:
          BASE_URL: https://${{ github.event_name == 'pull_request' && format('pr-{0}.', github.event.number) || github.ref_name != 'main' && format('{0}.', github.ref_name) || '' }}tw-catalog.pages.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          code=$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            --output /dev/null --write-out '%{http_code}' \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$BASE_URL/" || echo 000)
          if [ "$code" = "200" ]; then
            echo "Site root served (200)."
            exit 0
          fi
          case "$code" in
            3*)
              # The redirect target names the Access application that answered,
              # which is what tells you whether the policy you edited is even the
              # one covering this hostname. No secret appears in it.
              location=$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' \
                --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
                --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
                "$BASE_URL/" || true)
              echo "redirected to: ${location:-<no Location header>}"
              reason="Cloudflare Access intercepted it. A service token only works on a policy whose action is Service Auth — an Allow policy with a service-token rule still demands interactive login. Check that, and that the policy belongs to the application covering this hostname" ;;
            000) reason="the host could not be reached at all" ;;
            *) reason="the deployment did not serve the site root" ;;
          esac
          echo "::error::$BASE_URL/ returned $code, expected 200: $reason. See docs/runbooks/deployment.md."
          exit 1

      # The step above only proves the static assets are live; they are served
      # straight from the edge and answer 200 whether or not the Functions have
      # a usable environment. An unauthenticated session lookup separates the
      # two: 401 means the handlers were constructed and ran, 503 means
      # `requireSecret` threw because the environment is missing SESSION_SECRET
      # or HASH_PEPPER. Preview does not inherit production secrets, so this is
      # the check that catches a preview deployment whose portal is dead.
      - name: Smoke test Functions
        env:
          BASE_URL: https://${{ github.event_name == 'pull_request' && format('pr-{0}.', github.event.number) || github.ref_name != 'main' && format('{0}.', github.ref_name) || '' }}tw-catalog.pages.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for attempt in $(seq 1 5); do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$BASE_URL/api/auth/session" || echo 000)
            if [ "$code" = "401" ]; then
              echo "Functions reachable and configured (401 for an unauthenticated session)."
              exit 0
            fi
            echo "attempt $attempt: /api/auth/session returned $code"
            sleep 3
          done
          case "$code" in
            5*) reason="the environment is missing SESSION_SECRET or HASH_PEPPER" ;;
            3*) reason="Cloudflare Access intercepted the request before the Function ran — check CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET, and that the service token is allowed on this hostname" ;;
            000) reason="the host could not be reached at all" ;;
            *) reason="the Function answered unexpectedly" ;;
          esac
          echo "::error::/api/auth/session returned $code, expected 401: $reason. See docs/runbooks/deployment.md."
          exit 1
