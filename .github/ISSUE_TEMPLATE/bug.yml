name: 錯誤回報
description: 回報可重現的既有功能問題
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 請勿填入 email、登入連結、Access token 或其他個人／秘密資料。
  - type: textarea
    id: observed
    attributes:
      label: 實際發生什麼
      description: 請描述使用者看見的結果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期行為
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重現方式
      description: 包含入口、操作順序、裝置與瀏覽器；能穩定重現時請列出最短步驟。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可公開的佐證
      description: 可附截圖、錯誤訊息或 commit；請先移除個人資料與 secrets。
  - type: checkboxes
    id: checks
    attributes:
      label: 送出前確認
      options:
        - label: 我已搜尋過現有 issues，沒有找到相同問題。
          required: true
        - label: 這份回報不含個人資料、登入連結或秘密值。
          required: true
